<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Brain Interface</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff41;
            overflow: hidden;
            height: 100vh;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto 1fr;
            height: 100vh;
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
        }
        
        .header {
            grid-column: 1 / -1;
            text-align: center;
            background: linear-gradient(45deg, #001a00, #003300);
            border: 1px solid #00ff41;
            border-radius: 8px;
            padding: 15px;
            position: relative;
            overflow: hidden;
        }
        
        .header h1 {
            margin: 0;
            font-size: 24px;
            text-shadow: 0 0 10px #00ff41;
        }
        
        .header .subtitle {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        .header .robot-name {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 14px;
            padding: 5px 10px;
            border: 1px solid #00ff41;
            border-radius: 4px;
            background: rgba(0, 255, 65, 0.1);
        }
        
        .status-panel {
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid #00ff41;
            border-radius: 8px;
            padding: 15px;
            overflow: hidden;
        }
        
        .brain-activity {
            grid-column: 1;
            grid-row: 2;
        }
        
        .robot-state {
            grid-column: 2;
            grid-row: 2;
        }
        
        .conversation-flow {
            grid-column: 1 / -1;
            grid-row: 3;
        }
        
        .panel-title {
            color: #00ff41;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
        }
        
        /* Neural Activity Animation */
        .neural-bars {
            display: flex;
            align-items: flex-end;
            height: 80px;
            gap: 3px;
            margin-bottom: 15px;
        }
        
        .neural-bar {
            flex: 1;
            background: linear-gradient(to top, #004400, #00ff41);
            border-radius: 2px;
            transition: height 0.3s ease;
            min-height: 5px;
        }
        
        /* Processing Pipeline */
        .pipeline {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 12px;
        }
        
        .pipeline-step {
            flex: 1;
            text-align: center;
            padding: 8px;
            border: 1px solid #333;
            margin: 0 2px;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .pipeline-step.active {
            background: #003300;
            border-color: #00ff41;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }
        
        .pipeline-step.thinking {
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* System Metrics */
        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .metric {
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px;
            font-size: 11px;
        }
        
        .metric-label {
            display: block;
            opacity: 0.7;
        }
        
        .metric-value {
            font-size: 14px;
            font-weight: bold;
        }
        
        .metric-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        
        .metric-fill {
            height: 100%;
            background: linear-gradient(to right, #ff4444, #ffff44, #44ff44);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        /* Conversation Log */
        .conversation-log {
            background: #0a0a0a;
            border: 1px solid #333;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.4;
        }
        
        .log-entry {
            margin-bottom: 5px;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .log-timestamp {
            color: #666;
            margin-right: 10px;
        }
        
        .log-user { color: #4444ff; }
        .log-robot { color: #ff4444; }
        .log-system { color: #ffff44; }
        .log-thinking { color: #ff44ff; }
        
        /* Robot Eyes Animation */
        .robot-eyes {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60px;
            margin-bottom: 15px;
        }
        
        .eye {
            width: 20px;
            height: 20px;
            border: 2px solid #00ff41;
            border-radius: 50%;
            margin: 0 10px;
            position: relative;
            overflow: hidden;
        }
        
        .eye-pupil {
            width: 10px;
            height: 10px;
            background: #00ff41;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }
        
        .eye.thinking .eye-pupil {
            animation: eyeThink 2s infinite;
        }
        
        .eye.listening .eye-pupil {
            animation: eyeListen 1.5s infinite;
        }
        
        .eye.speaking .eye-pupil {
            animation: eyeSpeak 0.8s infinite;
        }
        
        @keyframes eyeThink {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            25% { transform: translate(-30%, -50%) scale(0.8); }
            50% { transform: translate(-70%, -50%) scale(1.2); }
            75% { transform: translate(-50%, -30%) scale(0.9); }
        }
        
        @keyframes eyeListen {
            0%, 100% { transform: translate(-50%, -50%) scale(1); background: #00ff41; }
            50% { transform: translate(-50%, -50%) scale(1.3); background: #4444ff; }
        }
        
        @keyframes eyeSpeak {
            0%, 100% { transform: translate(-50%, -50%) scale(1); background: #00ff41; }
            25% { transform: translate(-50%, -50%) scale(0.7); background: #ff4444; }
            75% { transform: translate(-50%, -50%) scale(1.1); background: #ff4444; }
        }
        
        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        
        .btn {
            background: transparent;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #00ff41;
            color: #000;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn.emergency {
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .btn.emergency:hover {
            background: #ff4444;
            color: #000;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto 1fr;
            }
            
            .brain-activity { grid-column: 1; grid-row: 2; }
            .robot-state { grid-column: 1; grid-row: 3; }
            .conversation-flow { grid-column: 1; grid-row: 4; }
        }
        
        /* Hidden elements for legacy browser compatibility */
        .hidden { display: none; }
        
        /* Network activity indicator */
        .network-activity {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .network-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            animation: networkBlink 2s infinite;
        }
        
        .network-dot.active {
            background: #00ff41;
            animation: networkActive 0.5s infinite;
        }
        
        @keyframes networkBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
        
        @keyframes networkActive {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="network-activity">
                <span class="network-dot" id="network-indicator"></span>
                <span id="network-status">OFFLINE</span>
            </div>
            <h1>ROBOT BRAIN INTERFACE</h1>
            <div class="subtitle">Real-time Neural Activity Monitor</div>
            <div class="robot-name" id="robot-name">HAKU-7</div>
        </div>

        <div class="status-panel brain-activity">
            <div class="panel-title">Neural Activity</div>
            
            <div class="neural-bars" id="neural-bars">
                <!-- Neural bars will be generated by JavaScript -->
            </div>
            
            <div class="pipeline">
                <div class="pipeline-step" id="step-listening">LISTENING</div>
                <div class="pipeline-step" id="step-processing">PROCESSING</div>
                <div class="pipeline-step" id="step-thinking">THINKING</div>
                <div class="pipeline-step" id="step-responding">RESPONDING</div>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="sendTestMessage()">Test Input</button>
                <button class="btn" onclick="clearConversation()">Clear Log</button>
                <button class="btn emergency" onclick="emergencyStop()">EMERGENCY STOP</button>
            </div>
        </div>

        <div class="status-panel robot-state">
            <div class="panel-title">System Status</div>
            
            <div class="robot-eyes">
                <div class="eye" id="left-eye">
                    <div class="eye-pupil"></div>
                </div>
                <div class="eye" id="right-eye">
                    <div class="eye-pupil"></div>
                </div>
            </div>
            
            <div class="metrics">
                <div class="metric">
                    <span class="metric-label">CPU USAGE</span>
                    <span class="metric-value" id="cpu-value">--</span>
                    <div class="metric-bar">
                        <div class="metric-fill" id="cpu-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="metric">
                    <span class="metric-label">MEMORY</span>
                    <span class="metric-value" id="memory-value">--</span>
                    <div class="metric-bar">
                        <div class="metric-fill" id="memory-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="metric">
                    <span class="metric-label">BATTERY</span>
                    <span class="metric-value" id="battery-value">--</span>
                    <div class="metric-bar">
                        <div class="metric-fill" id="battery-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="metric">
                    <span class="metric-label">TEMP</span>
                    <span class="metric-value" id="temp-value">--</span>
                    <div class="metric-bar">
                        <div class="metric-fill" id="temp-bar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-panel conversation-flow">
            <div class="panel-title">Conversation Stream</div>
            <div class="conversation-log" id="conversation-log">
                <div class="log-entry log-system">
                    <span class="log-timestamp">[BOOT]</span>
                    ROBOT BRAIN INTERFACE INITIALIZED
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables - using var for older browser compatibility
        var ws = null;
        var sttWs = null;
        var isConnected = false;
        var currentRobot = 'Haku';
        var neuralBars = [];
        var conversationState = 'idle'; // idle, listening, processing, thinking, responding
        var lastSTTMessage = '';
        var isThinking = false;
        
        // Neural activity simulation
        var neuralActivity = [];
        var activityInterval = null;
        
        // STT WebSocket connection details
        var sttConfig = {
            host: '10.0.0.2',  // From .env file
            port: 8765
        };

        // Initialize the brain interface
        function init() {
            log('INITIALIZING ROBOT BRAIN INTERFACE...', 'system');
            
            // Generate neural bars
            generateNeuralBars();
            
            // Connect to main WebSocket
            connectWebSocket();
            
            // Connect to STT WebSocket for real-time processing updates
            connectSTTWebSocket();
            
            // Start neural activity simulation
            startNeuralActivity();
            
            // Set up periodic status updates
            setInterval(updateRobotStatus, 2000);
            setInterval(updateNeuralActivity, 100);
            
            log('BRAIN INTERFACE ONLINE', 'system');
        }

        // Generate neural activity bars
        function generateNeuralBars() {
            var container = document.getElementById('neural-bars');
            container.innerHTML = '';
            
            for (var i = 0; i < 20; i++) {
                var bar = document.createElement('div');
                bar.className = 'neural-bar';
                bar.style.height = '5px';
                container.appendChild(bar);
                neuralBars.push(bar);
                neuralActivity.push(Math.random() * 0.3 + 0.1);
            }
        }

        // Start neural activity animation
        function startNeuralActivity() {
            if (activityInterval) clearInterval(activityInterval);
            
            activityInterval = setInterval(function() {
                updateNeuralActivity();
            }, 150);
        }

        // Update neural activity visualization
        function updateNeuralActivity() {
            var baseActivity = isThinking ? 0.8 : 0.3;
            var activityBoost = conversationState === 'thinking' ? 0.5 : 0;
            
            for (var i = 0; i < neuralBars.length; i++) {
                // Create wave-like patterns
                var wave = Math.sin((Date.now() / 500) + (i * 0.3)) * 0.3;
                var randomness = Math.random() * 0.4;
                var activity = baseActivity + wave + randomness + activityBoost;
                
                neuralActivity[i] = Math.max(0.05, Math.min(1, activity));
                neuralBars[i].style.height = (neuralActivity[i] * 75 + 5) + 'px';
                
                // Change color based on activity level
                var intensity = Math.floor(neuralActivity[i] * 255);
                var color = 'linear-gradient(to top, #004400, rgb(0, ' + intensity + ', 65))';
                neuralBars[i].style.background = color;
            }
        }

        // Main WebSocket connection
        function connectWebSocket() {
            try {
                var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                var wsUrl = protocol + '//' + window.location.host + '/api/sync';
                
                log('CONNECTING TO MAIN SYSTEM: ' + wsUrl, 'system');
                ws = new WebSocket(wsUrl);
                
                ws.onopen = function() {
                    log('MAIN SYSTEM CONNECTION ESTABLISHED', 'system');
                    isConnected = true;
                    updateNetworkStatus(true);
                };
                
                ws.onmessage = function(event) {
                    try {
                        var data = JSON.parse(event.data);
                        handleMainMessage(data);
                    } catch (error) {
                        log('ERROR PARSING MAIN MESSAGE: ' + error.message, 'system');
                    }
                };
                
                ws.onclose = function() {
                    log('MAIN SYSTEM CONNECTION LOST', 'system');
                    isConnected = false;
                    updateNetworkStatus(false);
                    setTimeout(connectWebSocket, 3000);
                };
                
                ws.onerror = function(error) {
                    log('MAIN SYSTEM ERROR: ' + error.message, 'system');
                };
                
            } catch (error) {
                log('FAILED TO CONNECT TO MAIN SYSTEM: ' + error.message, 'system');
                setTimeout(connectWebSocket, 5000);
            }
        }

        // STT WebSocket connection for real-time processing updates
        function connectSTTWebSocket() {
            try {
                var sttUrl = 'ws://' + sttConfig.host + ':' + sttConfig.port;
                log('CONNECTING TO STT SYSTEM: ' + sttUrl, 'system');
                
                sttWs = new WebSocket(sttUrl);
                
                sttWs.onopen = function() {
                    log('STT NEURAL LINK ESTABLISHED', 'system');
                    // Configure STT for brain monitoring
                    sttWs.send(JSON.stringify({
                        type: 'configure',
                        config: {
                            sendPartialResults: true,
                            enableLLM: true,
                            brainMonitor: true
                        }
                    }));
                };
                
                sttWs.onmessage = function(event) {
                    try {
                        var data = JSON.parse(event.data);
                        handleSTTMessage(data);
                    } catch (error) {
                        log('STT NEURAL DECODE ERROR: ' + error.message, 'system');
                    }
                };
                
                sttWs.onclose = function() {
                    log('STT NEURAL LINK DISCONNECTED', 'system');
                    setTimeout(connectSTTWebSocket, 5000);
                };
                
                sttWs.onerror = function(error) {
                    log('STT NEURAL LINK ERROR: ' + error.message, 'system');
                };
                
            } catch (error) {
                log('STT NEURAL LINK FAILED: ' + error.message, 'system');
                setTimeout(connectSTTWebSocket, 10000);
            }
        }

        // Handle STT messages for real-time processing visualization
        function handleSTTMessage(data) {
            switch(data.type) {
                case 'partial':
                    if (data.text && data.text.trim()) {
                        updateConversationState('listening');
                        setEyeState('listening');
                        log('AUDIO INPUT: ' + data.text, 'user');
                    }
                    break;
                    
                case 'complete':
                    if (data.text && data.text.trim()) {
                        updateConversationState('processing');
                        setEyeState('thinking');
                        log('SPEECH COMPLETE: ' + data.text, 'user');
                        lastSTTMessage = data.text;
                        
                        // Show thinking state
                        setTimeout(function() {
                            updateConversationState('thinking');
                            isThinking = true;
                            log('NEURAL PROCESSING: Analyzing input...', 'thinking');
                        }, 500);
                    }
                    break;
                    
                case 'llm_response_start':
                    log('LLM RESPONSE INITIATED', 'thinking');
                    updateConversationState('responding');
                    setEyeState('speaking');
                    isThinking = false;
                    break;
                    
                case 'llm_response_chunk':
                    if (data.text) {
                        log('NEURAL OUTPUT: ' + data.text, 'robot');
                    }
                    break;
                    
                case 'llm_response_complete':
                    log('RESPONSE TRANSMISSION COMPLETE', 'system');
                    updateConversationState('idle');
                    setEyeState('idle');
                    isThinking = false;
                    break;
                    
                case 'error':
                    log('STT ERROR: ' + data.error, 'system');
                    updateConversationState('idle');
                    setEyeState('idle');
                    isThinking = false;
                    break;
            }
        }

        // Handle main WebSocket messages
        function handleMainMessage(data) {
            switch(data.cmd) {
                case 'robot-status-update':
                    updateRobotStatusDisplay(data);
                    break;
                case 'robot-critical-alert':
                    log('CRITICAL ALERT: ' + data.robot + ' ' + data.field + ' = ' + data.value, 'system');
                    break;
                default:
                    // Silently handle other message types
                    break;
            }
        }

        // Update conversation state and pipeline visualization
        function updateConversationState(state) {
            conversationState = state;
            
            // Reset all pipeline steps
            var steps = ['listening', 'processing', 'thinking', 'responding'];
            for (var i = 0; i < steps.length; i++) {
                var element = document.getElementById('step-' + steps[i]);
                element.className = 'pipeline-step';
            }
            
            // Activate current step
            if (state !== 'idle') {
                var activeElement = document.getElementById('step-' + state);
                if (activeElement) {
                    activeElement.className = 'pipeline-step active';
                    if (state === 'thinking') {
                        activeElement.className += ' thinking';
                    }
                }
            }
        }

        // Set eye animation state
        function setEyeState(state) {
            var leftEye = document.getElementById('left-eye');
            var rightEye = document.getElementById('right-eye');
            
            // Remove all state classes
            leftEye.className = 'eye';
            rightEye.className = 'eye';
            
            // Add new state
            if (state !== 'idle') {
                leftEye.className += ' ' + state;
                rightEye.className += ' ' + state;
            }
        }

        // Update robot status display
        function updateRobotStatus() {
            fetch('/api/robot-status/detailed?robot=' + currentRobot)
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data && typeof data === 'object') {
                        updateMetric('cpu', data.cpu_usage || Math.random() * 60 + 20);
                        updateMetric('memory', data.memory_usage || Math.random() * 80 + 10);
                        updateMetric('battery', data.battery_level || Math.random() * 40 + 60);
                        updateMetric('temp', data.temperature || Math.random() * 20 + 40);
                    }
                })
                .catch(function(error) {
                    // Use simulated data if API is unavailable
                    updateMetric('cpu', Math.random() * 60 + 20);
                    updateMetric('memory', Math.random() * 80 + 10);
                    updateMetric('battery', Math.random() * 40 + 60);
                    updateMetric('temp', Math.random() * 20 + 40);
                });
        }

        // Update individual metric display
        function updateMetric(type, value) {
            var valueElement = document.getElementById(type + '-value');
            var barElement = document.getElementById(type + '-bar');
            
            if (valueElement && barElement) {
                var suffix = type === 'temp' ? '°C' : '%';
                valueElement.textContent = Math.round(value) + suffix;
                barElement.style.width = Math.min(100, Math.max(0, value)) + '%';
            }
        }

        // Update network status indicator
        function updateNetworkStatus(connected) {
            var indicator = document.getElementById('network-indicator');
            var status = document.getElementById('network-status');
            
            if (connected) {
                indicator.className = 'network-dot active';
                status.textContent = 'ONLINE';
            } else {
                indicator.className = 'network-dot';
                status.textContent = 'OFFLINE';
            }
        }

        // Logging function with terminal-style output
        function log(message, type) {
            type = type || 'system';
            
            var logContainer = document.getElementById('conversation-log');
            var logEntry = document.createElement('div');
            logEntry.className = 'log-entry log-' + type;
            
            var timestamp = new Date().toLocaleTimeString();
            var timestampSpan = document.createElement('span');
            timestampSpan.className = 'log-timestamp';
            timestampSpan.textContent = '[' + timestamp + ']';
            
            logEntry.appendChild(timestampSpan);
            logEntry.appendChild(document.createTextNode(' ' + message));
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // Keep only last 100 log entries
            while (logContainer.children.length > 100) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }

        // Control functions
        function sendTestMessage() {
            log('SENDING TEST INPUT TO NEURAL NETWORK', 'system');
            updateConversationState('processing');
            isThinking = true;
            
            setTimeout(function() {
                updateConversationState('thinking');
                log('PROCESSING TEST INPUT...', 'thinking');
            }, 1000);
            
            setTimeout(function() {
                updateConversationState('responding');
                setEyeState('speaking');
                log('TEST RESPONSE: Hello! I am functioning correctly.', 'robot');
                isThinking = false;
            }, 3000);
            
            setTimeout(function() {
                updateConversationState('idle');
                setEyeState('idle');
            }, 5000);
        }

        function clearConversation() {
            document.getElementById('conversation-log').innerHTML = '';
            log('CONVERSATION LOG CLEARED', 'system');
        }

        function emergencyStop() {
            log('EMERGENCY STOP ACTIVATED', 'system');
            updateConversationState('idle');
            setEyeState('idle');
            isThinking = false;
            
            // Send emergency stop to main system
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    cmd: 'req-execute',
                    message: '$StopAction',
                    robot: currentRobot,
                    type: 'emergency'
                }));
            }
        }

        // Initialize when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Keep connections alive
        setInterval(function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ cmd: 'ping' }));
            }
        }, 30000);
    </script>
</body>
