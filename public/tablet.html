<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Tablet Controller</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 300;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff6b6b;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #51cf66;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        /* Left panel - Robot controls */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Right panel - Status and logs */
        .right-panel {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Card styles */
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 400;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            padding: 12px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            margin: 5px;
            min-height: 45px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0px);
        }

        .btn.primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn.success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .btn.danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }

        /* Script grid */
        .script-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        /* Profile selector */
        .profile-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .profile-selector select {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 14px;
        }

        .profile-selector select option {
            background: #2a2a2a;
            color: white;
        }

        /* Status display */
        .status-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-display .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }

        .status-display .log-entry.error {
            color: #ff6b6b;
        }

        .status-display .log-entry.success {
            color: #51cf66;
        }

        .status-display .log-entry.info {
            color: #74c0fc;
        }

        /* Robot status grid */
        .robot-status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
        }

        .robot-status-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }

        .robot-status-item .label {
            font-weight: 500;
        }

        .robot-status-item .value {
            font-family: 'Courier New', monospace;
        }

        /* Movement controls */
        .movement-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 10px;
            height: 200px;
        }

        .movement-controls .btn {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        .movement-controls .btn:nth-child(2) { grid-column: 2; grid-row: 1; } /* Up */
        .movement-controls .btn:nth-child(1) { grid-column: 1; grid-row: 2; } /* Left */
        .movement-controls .btn:nth-child(3) { grid-column: 3; grid-row: 2; } /* Right */
        .movement-controls .btn:nth-child(4) { grid-column: 2; grid-row: 2; } /* Stop */
        .movement-controls .btn:nth-child(5) { grid-column: 2; grid-row: 3; } /* Down */

        /* Quick actions */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Hidden class for toggling */
        .hidden {
            display: none !important;
        }

        /* Loading spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive design for smaller tablets */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .right-panel {
                width: 100%;
                max-height: 300px;
            }
            
            .script-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Robot Tablet Controller</h1>
        <div class="status-indicator">
            <span class="status-dot" id="connection-status"></span>
            <span id="connection-text">Connecting...</span>
        </div>
    </div>

    <div class="main-content">
        <div class="left-panel">
            <!-- Profile Selection -->
            <div class="card">
                <h2>Robot Profile</h2>
                <div class="profile-selector">
                    <select id="profile-select">
                        <option value="">Loading profiles...</option>
                    </select>
                    <button class="btn" onclick="loadProfile()">Load</button>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="card">
                <h2>Quick Actions</h2>
                <div class="quick-actions">
                    <button class="btn danger" onclick="emergencyStop()">🛑 Emergency Stop</button>
                    <button class="btn success" onclick="greetVisitor()">👋 Greet Visitor</button>
                    <button class="btn primary" onclick="resetRobot()">🔄 Reset Robot</button>
                    <button class="btn" onclick="playDemo()">🎭 Demo Mode</button>
                </div>
            </div>

            <!-- Movement Controls -->
            <div class="card">
                <h2>Movement Controls</h2>
                <div class="movement-controls">
                    <button class="btn" onmousedown="startMovement('left')" onmouseup="stopMovement()" ontouchstart="startMovement('left')" ontouchend="stopMovement()">◀ Left</button>
                    <button class="btn" onmousedown="startMovement('forward')" onmouseup="stopMovement()" ontouchstart="startMovement('forward')" ontouchend="stopMovement()">▲ Forward</button>
                    <button class="btn" onmousedown="startMovement('right')" onmouseup="stopMovement()" ontouchstart="startMovement('right')" ontouchend="stopMovement()">▶ Right</button>
                    <button class="btn danger" onclick="stopMovement()">⏹ Stop</button>
                    <button class="btn" onmousedown="startMovement('backward')" onmouseup="stopMovement()" ontouchstart="startMovement('backward')" ontouchend="stopMovement()">▼ Backward</button>
                </div>
            </div>

            <!-- Scripts -->
            <div class="card">
                <h2>Available Scripts</h2>
                <div class="script-grid" id="script-container">
                    <button class="btn">Loading scripts...</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <!-- Robot Status -->
            <div class="card">
                <h2>Robot Status</h2>
                <div class="robot-status-grid" id="robot-status">
                    <div class="robot-status-item">
                        <span class="label">Status:</span>
                        <span class="value" id="robot-state">Unknown</span>
                    </div>
                    <div class="robot-status-item">
                        <span class="label">Battery:</span>
                        <span class="value" id="battery-level">--</span>
                    </div>
                    <div class="robot-status-item">
                        <span class="label">Connection:</span>
                        <span class="value" id="connection-quality">--</span>
                    </div>
                    <div class="robot-status-item">
                        <span class="label">Temperature:</span>
                        <span class="value" id="temperature">--</span>
                    </div>
                </div>
            </div>

            <!-- Activity Log -->
            <div class="card">
                <h2>Activity Log</h2>
                <div class="status-display" id="activity-log">
                    <div class="log-entry info">System starting...</div>
                </div>
                <button class="btn" onclick="clearLog()" style="margin-top: 10px; width: 100%;">Clear Log</button>
            </div>
        </div>
    </div>

    <script>
        // Global variables - using var for older browser compatibility
        var ws = null;
        var isConnected = false;
        var currentProfile = null;
        var scripts = {};
        var profiles = [];
        var movementInterval = null;
        var currentRobot = 'Haku'; // Default robot

        // Initialize the application
        function init() {
            log('Initializing tablet controller...', 'info');
            connectWebSocket();
            loadInitialData();
            
            // Set up periodic status updates
            setInterval(updateRobotStatus, 5000);
        }

        // WebSocket connection management
        function connectWebSocket() {
            try {
                var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                var wsUrl = protocol + '//' + window.location.host + '/api/sync';
                
                log('Connecting to: ' + wsUrl, 'info');
                ws = new WebSocket(wsUrl);
                
                ws.onopen = function() {
                    log('WebSocket connected', 'success');
                    isConnected = true;
                    updateConnectionStatus(true);
                    requestSync();
                };
                
                ws.onmessage = function(event) {
                    try {
                        var data = JSON.parse(event.data);
                        handleWebSocketMessage(data);
                    } catch (error) {
                        log('Error parsing WebSocket message: ' + error.message, 'error');
                    }
                };
                
                ws.onclose = function() {
                    log('WebSocket disconnected', 'error');
                    isConnected = false;
                    updateConnectionStatus(false);
                    
                    // Attempt to reconnect after 3 seconds
                    setTimeout(connectWebSocket, 3000);
                };
                
                ws.onerror = function(error) {
                    log('WebSocket error: ' + error.message, 'error');
                    isConnected = false;
                    updateConnectionStatus(false);
                };
                
            } catch (error) {
                log('Failed to create WebSocket: ' + error.message, 'error');
                setTimeout(connectWebSocket, 5000);
            }
        }

        // Handle incoming WebSocket messages
        function handleWebSocketMessage(data) {
            switch(data.cmd) {
                case 'res-sync':
                    handleSyncResponse(data.value);
                    break;
                case 'res-update-profile':
                    currentProfile = data.value;
                    log('Profile updated: ' + currentProfile.name, 'success');
                    break;
                case 'res-update-scripts':
                    scripts = data.value;
                    renderScripts();
                    log('Scripts updated', 'info');
                    break;
                case 'robot-status-update':
                    updateRobotStatusDisplay(data);
                    break;
                case 'robot-critical-alert':
                    log('CRITICAL: ' + data.robot + ' ' + data.field + ' = ' + data.value, 'error');
                    break;
                case 'pong':
                    // Handle keepalive response
                    break;
                default:
                    log('Unknown message type: ' + data.cmd, 'info');
            }
        }

        // Handle sync response
        function handleSyncResponse(data) {
            profiles = data.profiles || [];
            currentProfile = data.current_profile || null;
            scripts = data.scripts || {};
            
            renderProfiles();
            renderScripts();
            
            log('Data synchronized successfully', 'success');
        }

        // Send WebSocket message
        function sendMessage(cmd, message, robot, type) {
            if (!isConnected || !ws) {
                log('Cannot send message: not connected', 'error');
                return false;
            }
            
            try {
                var payload = {
                    cmd: cmd,
                    message: message,
                    robot: robot || currentRobot,
                    type: type || 'script'
                };
                
                ws.send(JSON.stringify(payload));
                return true;
            } catch (error) {
                log('Failed to send message: ' + error.message, 'error');
                return false;
            }
        }

        // Request sync from server
        function requestSync() {
            sendMessage('req-sync');
        }

        // Load initial data via REST API
        function loadInitialData() {
            // Load robot status
            fetch('/api/robot-status')
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    log('Robot status loaded', 'info');
                })
                .catch(function(error) {
                    log('Failed to load robot status: ' + error.message, 'error');
                });
        }

        // Update robot status display
        function updateRobotStatus() {
            fetch('/api/robot-status/detailed?robot=' + currentRobot)
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data && typeof data === 'object') {
                        document.getElementById('robot-state').textContent = data.current_behavior || 'idle';
                        document.getElementById('battery-level').textContent = (data.battery_level || '--') + '%';
                        document.getElementById('connection-quality').textContent = (data.connection_quality || '--') + '%';
                        document.getElementById('temperature').textContent = (data.temperature || '--') + '°C';
                    }
                })
                .catch(function(error) {
                    // Silently fail to avoid spam
                });
        }

        // Render profiles dropdown
        function renderProfiles() {
            var select = document.getElementById('profile-select');
            select.innerHTML = '';
            
            if (profiles.length === 0) {
                var option = document.createElement('option');
                option.value = '';
                option.textContent = 'No profiles available';
                select.appendChild(option);
                return;
            }
            
            for (var i = 0; i < profiles.length; i++) {
                var profile = profiles[i];
                var option = document.createElement('option');
                option.value = profile.name;
                option.textContent = profile.name;
                
                if (currentProfile && profile.name === currentProfile.name) {
                    option.selected = true;
                }
                
                select.appendChild(option);
            }
        }

        // Render scripts grid
        function renderScripts() {
            var container = document.getElementById('script-container');
            container.innerHTML = '';
            
            var scriptNames = Object.keys(scripts);
            if (scriptNames.length === 0) {
                var button = document.createElement('button');
                button.className = 'btn';
                button.textContent = 'No scripts available';
                button.disabled = true;
                container.appendChild(button);
                return;
            }
            
            for (var i = 0; i < scriptNames.length; i++) {
                var scriptName = scriptNames[i];
                var script = scripts[scriptName];
                
                var button = document.createElement('button');
                button.className = 'btn';
                button.textContent = scriptName;
                button.onclick = createScriptHandler(scriptName, script);
                
                container.appendChild(button);
            }
        }

        // Create script click handler
        function createScriptHandler(scriptName, script) {
            return function() {
                executeScript(scriptName, script);
            };
        }

        // Execute a script
        function executeScript(scriptName, script) {
            log('Executing script: ' + scriptName, 'info');
            
            var message = typeof script === 'string' ? script : script.text;
            var robot = (typeof script === 'object' && script.robot) ? script.robot : currentRobot;
            
            if (sendMessage('req-execute', message, robot, 'script')) {
                log('Script executed: ' + scriptName, 'success');
            } else {
                log('Failed to execute script: ' + scriptName, 'error');
            }
        }

        // Load selected profile
        function loadProfile() {
            var select = document.getElementById('profile-select');
            var selectedProfile = select.value;
            
            if (!selectedProfile) {
                log('No profile selected', 'error');
                return;
            }
            
            var profile = null;
            for (var i = 0; i < profiles.length; i++) {
                if (profiles[i].name === selectedProfile) {
                    profile = profiles[i];
                    break;
                }
            }
            
            if (profile) {
                if (sendMessage('req-update-profile', profile)) {
                    log('Loading profile: ' + selectedProfile, 'info');
                }
            } else {
                log('Profile not found: ' + selectedProfile, 'error');
            }
        }

        // Quick action functions
        function emergencyStop() {
            log('EMERGENCY STOP activated', 'error');
            sendMessage('req-execute', '$StopAction', currentRobot, 'emergency');
        }

        function greetVisitor() {
            log('Greeting visitor', 'info');
            sendMessage('req-execute', 'Hello! Welcome to our lab. I am a social robot here to help and interact with visitors.', currentRobot, 'greeting');
        }

        function resetRobot() {
            log('Resetting robot', 'info');
            sendMessage('req-execute', '$Reset', currentRobot, 'system');
        }

        function playDemo() {
            log('Starting demo mode', 'info');
            sendMessage('req-execute', '$Demo', currentRobot, 'demo');
        }

        // Movement control functions
        function startMovement(direction) {
            if (movementInterval) {
                clearInterval(movementInterval);
            }
            
            log('Starting movement: ' + direction, 'info');
            
            var movement = getMovementCommand(direction);
            sendMessage('req-execute', movement, currentRobot, 'movement');
            
            // Continue movement while button is held
            movementInterval = setInterval(function() {
                sendMessage('req-execute', movement, currentRobot, 'movement');
            }, 100);
        }

        function stopMovement() {
            if (movementInterval) {
                clearInterval(movementInterval);
                movementInterval = null;
            }
            
            log('Stopping movement', 'info');
            sendMessage('req-execute', '$StopMovement', currentRobot, 'movement');
        }

        function getMovementCommand(direction) {
            switch(direction) {
                case 'forward': return '$MoveForward';
                case 'backward': return '$MoveBackward';
                case 'left': return '$TurnLeft';
                case 'right': return '$TurnRight';
                default: return '$StopMovement';
            }
        }

        // Update connection status indicator
        function updateConnectionStatus(connected) {
            var statusDot = document.getElementById('connection-status');
            var statusText = document.getElementById('connection-text');
            
            if (connected) {
                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Connected';
            } else {
                statusDot.className = 'status-dot';
                statusText.textContent = 'Disconnected';
            }
        }

        // Logging function
        function log(message, type) {
            type = type || 'info';
            
            var logContainer = document.getElementById('activity-log');
            var logEntry = document.createElement('div');
            logEntry.className = 'log-entry ' + type;
            
            var timestamp = new Date().toLocaleTimeString();
            logEntry.textContent = '[' + timestamp + '] ' + message;
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // Keep only last 50 log entries
            while (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.firstChild);
            }
            
            // Also log to console for debugging
            console.log('[Tablet] ' + message);
        }

        // Clear activity log
        function clearLog() {
            document.getElementById('activity-log').innerHTML = '';
            log('Log cleared', 'info');
        }

        // Prevent context menu on touch devices
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Prevent scrolling on touch devices
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        // Initialize when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Keep connection alive
        setInterval(function() {
            if (isConnected && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ cmd: 'ping' }));
            }
        }, 30000);
    </script>
</body>
</html>
