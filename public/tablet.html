<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Brain Interface</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #E60028;
            overflow: hidden;
            height: 100vh;
            width: 100%;
        }
        
        .container {
            width: 100%;
            height: 100vh;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
        }
        
        .header {
            text-align: center;
            background: linear-gradient(45deg, #1a0000, #330000);
            border: 1px solid #E60028;
            border-radius: 8px;
            padding: 15px;
            position: relative;
            overflow: hidden;
            height: 35px;
            margin-bottom: 10px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 24px;
            text-shadow: 0 0 10px #E60028;
        }
        
        .header .subtitle {
            font-size: 12px;
            opacity: 0.7;
        }
        
        .header .robot-name {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 14px;
            padding: 5px 10px;
            border: 1px solid #E60028;
            border-radius: 4px;
            background: rgba(230, 0, 40, 0.1);
        }
        
        .main-content {
            background: rgba(20, 0, 0, 0.8);
            border: 1px solid #E60028;
            border-radius: 8px;
            padding: 0;
            overflow: hidden;
            position: absolute;
            top: 75px;
            left: 10px;
            right: 10px;
            bottom: 200px;
        }
        
        .llm-display {
            background: rgba(20, 0, 0, 0.8);
            border: 1px solid #E60028;
            border-radius: 8px;
            padding: 10px;
            position: absolute;
            bottom: 80px;
            left: 10px;
            right: 10px;
            height: 100px;
            display: flex;
            gap: 10px;
        }
        
        .llm-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .llm-title {
            font-size: 12px;
            color: #E60028;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .llm-content {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
            border-radius: 4px;
            padding: 8px;
            font-size: 11px;
            color: #fff;
            overflow-y: auto;
            word-wrap: break-word;
        }
        
        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            margin: 0;
            padding: 0;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none; /* prevent any UI/hover overlays */
        }
        
        .footer {
            background: rgba(20, 0, 0, 0.8);
            border: 1px solid #E60028;
            color: rgba(255, 255, 255, 1);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            opacity: 0.9;
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: 30px;
            line-height: 30px;
        }
        
        .footer img {
            height: 40px;
            vertical-align: middle;
        }
        
        /* Network activity indicator */
        .network-activity {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .network-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            animation: networkBlink 2s infinite;
        }
        
        .network-dot.active {
            background: #E60028;
            animation: networkActive 0.5s infinite;
        }
        
        @keyframes networkBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
        
        @keyframes networkActive {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="network-activity">
                <span class="network-dot" id="network-indicator"></span>
                <span id="network-status">OFFLINE</span>
            </div>
            <h1>HAKU THE AI ROBOT</h1>
            <!-- <div class="subtitle">Real-time Activity Monitor</div> -->
            <div class="robot-name" id="robot-name">HAKU</div>
        </div>

        <div class="main-content">
            <div id="log-display" style="width: 100%; height: 100%; background: #000; color: #00ff00; font-family: monospace; font-size: 12px; padding: 10px; overflow-y: auto; border: 1px solid #E60028;">
                <div style="color: #E60028; font-weight: bold; margin-bottom: 10px;">TABLET DEBUG LOG</div>
                <div id="log-content"></div>
            </div>
        </div>
        
        <div class="llm-display">
            <div class="llm-section">
                <div class="llm-title">USER INPUT</div>
                <div class="llm-content" id="user-input">Waiting for input...</div>
            </div>
            <div class="llm-section">
                <div class="llm-title">AI RESPONSE</div>
                <div class="llm-content" id="ai-response">Waiting for response...</div>
            </div>
        </div>
        


        <div class="footer">
            Powered by &nbsp;<img src="RACE-WHITE-WIDE.png" alt="Race Logo">
        </div>
    </div>
    <script>
(function(){
  // --- 参数与基址 ---
  var params = new URLSearchParams(window.location.search);
  var robot = (params.get('robot') || window.DEFAULT_ROBOT_NAME || 'Haku').trim();
  var BASE  = (params.get('base') || '').trim(); // 例：http://10.0.0.12:3000
  if (!/^https?:\/\//i.test(BASE)) {
    console.warn('[Tablet] Missing or invalid ?base=, fallback to location (may fail on Pepper).');
    BASE = location.origin;
  }
  function abs(p){ return BASE.replace(/\/$/,'') + p; }

  // --- 心跳 ---
  async function heartbeat(tag){
    try{
      await fetch(abs('/api/robot-tablet/heartbeat'), {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ robot, tag: tag||'tick' })
      });
    }catch(e){ /* ignore */ }
  }

  // --- UI 显示 ---
  document.getElementById('robot-name').textContent = robot;

  // --- LLM 显示逻辑 ---
  var currentAIResponse = '';
  function updateLLMDisplay(type, content, isChunk) {
    var el = document.getElementById(type === 'user' ? 'user-input' : 'ai-response');
    if (!el) return;
    if (type === 'ai' && isChunk) {
      currentAIResponse += content || '';
      el.textContent = currentAIResponse || 'Waiting for response...';
    } else if (type === 'user') {
      currentAIResponse = '';
      document.getElementById('ai-response').textContent = 'Waiting for response...';
      el.textContent = content || 'Waiting for input...';
    } else {
      el.textContent = content || (type === 'user' ? 'Waiting for input...' : 'Waiting for response...');
    }
    el.scrollTop = el.scrollHeight;
  }
  // 暴露给 Pepper 的 executeJS 注入
  window.pushMsg = function(m){
    try{
      if (!m) return;
      if (m.type === 'llm-user-input')  updateLLMDisplay('user', m.content, false);
      else if (m.type === 'llm-ai-response') updateLLMDisplay('ai', m.content, !!m.isChunk);
    }catch(e){ console.error('[Tablet] pushMsg error', e); }
  };
  window.updateLLMDisplay = updateLLMDisplay;

  // --- WebSocket 主通道 ---
  var mainWs = null, wsRetryTimer = null;
  function wsURL(){
    var host = BASE.replace(/^https?:\/\//,'');
    var scheme = /^https:\/\//i.test(BASE) ? 'wss://' : 'ws://';
    return scheme + host + '/api/sync';
  }
  function connectWS(){
    try{
      if (mainWs) { try{ mainWs.close(); }catch(_){} mainWs = null; }
      var url = wsURL();
      console.log('[Tablet] WS connect →', url, 'robot=', robot);
      mainWs = new WebSocket(url);

      mainWs.onopen = function(){
        console.log('[Tablet] WS open');
        document.getElementById('network-indicator').classList.add('active');
        document.getElementById('network-status').textContent = 'ONLINE';
        // 上线即注册，声明自己是 tablet
        try { mainWs.send(JSON.stringify({ type:'hello', role:'tablet', robot })); } catch(e){}
        heartbeat('ws-open');
      };

      mainWs.onmessage = function(evt){
        var msg = null;
        try{ msg = JSON.parse(evt.data || '{}'); }catch(e){ console.error('[Tablet] WS parse error', e); return; }
        
        // 调试信息
        console.log('[Tablet] Received message:', msg);
        
        // 仅接收发往本机器人或广播的消息
        var toMe = !msg.robot || String(msg.robot).toLowerCase() === robot.toLowerCase();
        if (!toMe) {
          console.log('[Tablet] Message not for this robot:', msg.robot, 'vs', robot);
          return;
        }
        
        if (msg.cmd === 'tablet_ping') { heartbeat('pong'); return; }
        
        // 处理LLM消息
        if (msg.type === 'llm-user-input') {
          console.log('[Tablet] Processing user input:', msg.content);
          updateLLMDisplay('user', msg.content, false);
        }
        else if (msg.type === 'llm-ai-response') {
          console.log('[Tablet] Processing AI response:', msg.content);
          updateLLMDisplay('ai', msg.content, true);
        }
        else {
          console.log('[Tablet] Unhandled message type:', msg.type);
        }
      };

      mainWs.onerror = function(err){
        console.error('[Tablet] WS error', err);
      };

      mainWs.onclose = function(ev){
        console.warn('[Tablet] WS close', ev.code, ev.reason||'');
        document.getElementById('network-indicator').classList.remove('active');
        document.getElementById('network-status').textContent = 'OFFLINE';
        if (wsRetryTimer) clearTimeout(wsRetryTimer);
        wsRetryTimer = setTimeout(connectWS, 2000);
      };
    }catch(e){
      console.error('[Tablet] WS create failed', e);
      if (wsRetryTimer) clearTimeout(wsRetryTimer);
      wsRetryTimer = setTimeout(connectWS, 2000);
    }
  }

  // --- 轮询兜底（用于快速定位 WS/路由问题）---
  async function pollLoop(){
    try{
      const r = await fetch(abs('/api/pull?robot='+encodeURIComponent(robot)), { cache: 'no-store' });
      if (r.ok){
        const list = await r.json(); // 期望数组 [{type, content, isChunk, robot}, ...]
        if (Array.isArray(list)) {
          console.log('[Tablet] Poll received:', list.length, 'messages');
          list.forEach(window.pushMsg);
        }
      } else {
        console.warn('[Tablet] Poll failed:', r.status, r.statusText);
      }
    }catch(e){ 
      console.error('[Tablet] Poll error:', e);
    }
    setTimeout(pollLoop, 2000);
  }

  // --- 日志显示 ---
  var logEl = document.getElementById('log-content');
  var logLines = [];
  function addLog(msg) {
    var timestamp = new Date().toLocaleTimeString();
    logLines.push('[' + timestamp + '] ' + msg);
    if (logLines.length > 50) logLines.shift();
    if (logEl) logEl.innerHTML = logLines.join('<br>');
  }
  
  // 重写console.log
  var originalLog = console.log;
  console.log = function() {
    originalLog.apply(console, arguments);
    addLog(Array.from(arguments).join(' '));
  };
  var originalError = console.error;
  console.error = function() {
    originalError.apply(console, arguments);
    addLog('ERROR: ' + Array.from(arguments).join(' '));
  };
  var originalWarn = console.warn;
  console.warn = function() {
    originalWarn.apply(console, arguments);
    addLog('WARN: ' + Array.from(arguments).join(' '));
  };

  // --- 启动 ---
  addLog('Initializing tablet for robot: ' + robot);
  addLog('Base URL: ' + BASE);
  
  heartbeat('init');
  connectWS();
  pollLoop();
  setInterval(heartbeat, 5000);
  
  // 定期更新状态
  setInterval(function(){
    var wsStatus = mainWs ? ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'][mainWs.readyState] : 'NULL';
    var statusEl = document.getElementById('network-status');
    if (statusEl) statusEl.textContent = wsStatus;
  }, 1000);
})();
</script>

</body>
</html>
