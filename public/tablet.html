<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Brain Interface</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background: #000000;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100%;
        }

        .container {
            width: 100%;
            height: 100vh;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
        }

        .header {
            text-align: center;
            background: linear-gradient(45deg, #1a1a1a, #2a2a2a);
            border: 1px solid #666666;
            border-radius: 8px;
            padding: 15px;
            position: relative;
            overflow: hidden;
            height: 35px;
            margin-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #ffffff;
        }

        .header .subtitle {
            font-size: 12px;
            opacity: 0.7;
        }

        .header .robot-name {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 14px;
            padding: 5px 10px;
            border: 1px solid #666666;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            display: none;
        }

        .main-content {
            background: transparent;
            border: none;
            border-radius: 8px;
            padding: 0;
            overflow: hidden;
            position: absolute;
            top: 75px;
            left: 10px;
            right: 10px;
            bottom: 60px;
        }

        .conversation-interface {
            display: none;
            height: 100%;
            padding: 0;
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            background: rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        .conversation-interface.active {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }

        .user-message-container {
            position: absolute;
            top: 5%;
            left: 2%;
            width: 75%;
            height: 35%;
        }

        .user-message-area {
            width: 100%;
            height: 100%;
            background: #e3f2fd;
            border: 3px solid #2196f3;
            border-radius: 12px;
            padding: 3%;
            box-sizing: border-box;
            overflow: hidden;
            pointer-events: auto;
        }

        .user-message-label {
            position: absolute;
            top: 15%;
            right: -12%;
            text-align: center;
            width: 10%;
        }

        .user-message-label .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 5px;
        }

        .user-message-label .name {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }

        .ai-message-container {
            position: absolute;
            bottom: 5%;
            right: 2%;
            width: 75%;
            height: 45%;
        }

        .ai-message-area {
            width: 100%;
            height: 100%;
            background: #f3e5f5;
            border: 3px solid #9c27b0;
            border-radius: 12px;
            padding: 3%;
            box-sizing: border-box;
            overflow: hidden;
            pointer-events: auto;
        }

        .ai-message-label {
            position: absolute;
            top: 15%;
            left: -12%;
            text-align: center;
            width: 10%;
        }

        .ai-message-label .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 5px;
        }

        .ai-message-label .name {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }

        .message-content {
            font-size: 32px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
            height: 100%;
            overflow-y: auto;
            text-align: left;
            padding: 0;
        }

        .user-message-area .message-content {
            color: #1565c0;
        }

        .ai-message-area .message-content {
            color: #7b1fa2;
        }

        .ai-response-streaming {
            position: relative;
        }

        .ai-response-streaming::after {
            content: '▋';
            animation: blink 1s infinite;
            color: #9c27b0;
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }

        .text-bubble {
            position: fixed;
            top: 2%;
            left: 5%;
            width: 90%;
            height: 8%;
            background: rgba(50, 50, 50, 0.95);
            border: 2px solid #666666;
            border-radius: 15px;
            padding: 0;
            color: #ffffff;
            z-index: 999999;
            isolation: isolate;
            will-change: opacity;
            opacity: 0;
            display: none;
            overflow: hidden;
            text-align: center;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .text-bubble.show {
            opacity: 1;
            display: block;
        }

        .text-bubble.hide {
            opacity: 0;
        }

        .text-bubble .bubble-content {
            font-size: 24px;
            color: #ffffff;
            line-height: 1.2;
            padding: 20px;
            word-wrap: break-word;
            white-space: normal;
            text-align: center;
        }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: block;
            z-index: -1;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            border: none;
            display: block !important;
            margin: 0;
            padding: 0;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .footer {
            background: rgba(40, 40, 40, 0.9);
            color: #ffffff;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            opacity: 0.9;
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: 30px;
            line-height: 30px;
        }



        .footer img {
            height: 35px;
            vertical-align: middle;
            margin-top: -5px;
        }

        /* Network activity indicator */
        .network-activity {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 12px;
            display: none;
            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;
        }

        .network-activity span:last-child {
            margin-left: 5px;
        }

        .network-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            animation: networkBlink 2s infinite;
        }

        .network-dot.active {
            background: #00ff00;
            animation: networkActive 0.5s infinite;
        }

        @keyframes networkBlink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0.3;
            }
        }

        @keyframes networkActive {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.2);
            }
        }

        /* City North image pop up */
        .cn-overlay-img {
            position: fixed;
            left: 50%;
            top: 50%;
            margin-left: -480px;
            margin-top: -360px;
            width: 960px;
            height: 720px;
            border: 2px solid #E60028;
            border-radius: 12px;
            background: #000000;
            z-index: 9999999;
            isolation: isolate;
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .cn-overlay-img.show {
            display: block;
            opacity: 1;
        }

        .cn-overlay-img.hide {
            opacity: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="network-activity">
                <div class="network-dot" id="network-indicator"></div>
                <span id="network-status">OFFLINE</span>
            </div>
            <h1>Hi, I'm HAKU</h1>
            <div class="robot-name" id="robot-name">Haku</div>
        </div>

        <div class="main-content">
            <div class="video-container" id="video-container">
                <!-- <img src="http://198.18.0.1:3000/a.jpg"></img> -->
                <video autoplay muted loop playsinline>
                    <source src="http://198.18.0.1/apps/rmit-race/out_0p5x.mp4" type="video/mp4">
                    <source src="http://198.18.0.1/apps/rmit-race/out_0p5x.webm" type="video/webm">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="conversation-interface" id="conversation-interface">
                <div class="user-message-container">
                    <div class="user-message-label">
                        <span class="emoji">👤</span>
                        <span class="name">You</span>
                    </div>
                    <div class="user-message-area" id="user-message-area">
                        <div class="message-content" id="user-message-content">Waiting for your message...</div>
                    </div>
                </div>

                <div class="ai-message-container">
                    <div class="ai-message-label">
                        <span class="emoji">🤖</span>
                        <span class="name">Haku</span>
                    </div>
                    <div class="ai-message-area" id="ai-message-area">
                        <div class="message-content" id="ai-message-content">Waiting for Haku's response...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-bubble" id="text-bubble">
            <div class="bubble-content" id="bubble-content">Waiting for message...</div>
        </div>

        <div class="footer">
            <img src="PB-RACE-WHITE-WIDE-1.svg" alt="Race Logo">
        </div>

        <!-- Preloaded City North Images -->
        <img id="cn-overlay-a" src="http://198.18.0.1:3000/a.jpg" alt="City North A" class="cn-overlay-img">
        <img id="cn-overlay-b" src="http://198.18.0.1:3000/b.jpg" alt="City North B" class="cn-overlay-img">
        <img id="cn-overlay-c" src="http://198.18.0.1:3000/c.jpg" alt="City North C" class="cn-overlay-img">


    </div>
    <script>
        (function () {
            var logEl = document.getElementById('log-content')
            function addLog (s) {
                try {
                    var t = (new Date()).toLocaleTimeString()
                    if (logEl) { logEl.innerHTML += '[' + t + '] ' + s + '<br>'; logEl.scrollTop = logEl.scrollHeight }
                } catch (e) { }
            }
            window.onerror = function (msg, url, line, col, err) { addLog('ONERROR: ' + msg + ' @' + line + ':' + col) }

            // cover console
            var c = window.console = window.console || {};
            ['log', 'warn', 'error'].forEach(function (k) {
                var orig = c[k] || function () { }
                c[k] = function () {
                    try {
                        var s = Array.prototype.slice.call(arguments).join(' ')
                        addLog((k === 'log' ? '' : (k.toUpperCase() + ': ')) + s)
                        orig.apply ? orig.apply(console, arguments) : orig(s)
                    } catch (e) { }
                }
            })

            // ---- preload & safe show/hide helpers ----
            var ASSETS = {
                images: [
                    'http://198.18.0.1:3000/a.jpg',
                    'http://198.18.0.1:3000/b.jpg',
                    'http://198.18.0.1:3000/c.jpg'
                ],

            }
            var ready = { images: {} }

            function preloadAssets () {
                ASSETS.images.forEach(function (src) {
                    var img = new Image()
                    img.onload = function () { ready.images[src] = true }
                    img.onerror = function () { ready.images[src] = false }
                    img.src = src
                })

            }
            preloadAssets()

            function showEl (el, showClass) {
                if (!el) return
                el.style.removeProperty('display')
                el.classList.remove('hide')
                el.classList.add(showClass || 'show')
            }
            function hideEl (el) {
                if (!el) return
                el.classList.remove('show')
                el.classList.add('hide')
                setTimeout(function () { el.classList.remove('hide') }, 400) // 结束后回到基础类
            }

            // ---- City North ----
            var cnOverlays = {
                'http://198.18.0.1:3000/a.jpg': document.getElementById('cn-overlay-a'),
                'http://198.18.0.1:3000/b.jpg': document.getElementById('cn-overlay-b'),
                'http://198.18.0.1:3000/c.jpg': document.getElementById('cn-overlay-c')
            }
            var particles = []
            var _cnBusy = 0
            var currentOverlay = null
            var CN_IMAGES = ['http://198.18.0.1:3000/a.jpg', 'http://198.18.0.1:3000/b.jpg', 'http://198.18.0.1:3000/c.jpg']

            function showCityNorth (imageSrc) {
                if (_cnBusy) return
                _cnBusy = 1

                var src = imageSrc || 'http://198.18.0.1:3000/a.jpg'
                var overlay = cnOverlays[src]
                if (!overlay) { console.error('City North image not found:', src); _cnBusy = 0; return }

                var tries = 0;
                (function waitReady () {
                    if (ready.images[src] || tries > 10) {
                        currentOverlay = overlay
                        showEl(currentOverlay, 'show')
                        setTimeout(hideCityNorth, 10000)
                    } else {
                        tries++; setTimeout(waitReady, 100)
                    }
                })()
            }

            function hideCityNorth () {
                if (!currentOverlay) { _cnBusy = 0; return }
                hideEl(currentOverlay)
                currentOverlay = null
                _cnBusy = 0
            }

            function createParticles () {
                var container = document.querySelector('.container')
                if (!container) return

                for (var i = 0; i < 10; i++) {
                    var particle = document.createElement('div')
                    particle.className = 'particle'
                    particle.style.left = Math.random() * 100 + '%'
                    particle.style.top = Math.random() * 100 + '%'
                    particle.style.animationDelay = Math.random() * 3 + 's'
                    container.appendChild(particle)
                    particles.push(particle)
                }
            }

            function clearParticles () {
                particles.forEach(function (particle) {
                    if (particle.parentNode) {
                        particle.parentNode.removeChild(particle)
                    }
                })
                particles = []
            }

            window.showCityNorth = showCityNorth
            window.hideCityNorth = hideCityNorth

            // ---- Tablet Video Control ----
            var backgroundVideo = null
            var originalVideoSrc = ''

            function playTabletVideo (videoUrl) {
                var videoContainer = document.getElementById('video-container')
                if (!videoContainer) return

                var video = videoContainer.querySelector('video')
                if (!video) return

                // Store original video source if not already stored
                if (!originalVideoSrc) {
                    var source = video.querySelector('source')
                    if (source) {
                        originalVideoSrc = source.src
                    }
                }

                console.log('Playing tablet video:', videoUrl)

                // Replace video source
                video.pause()
                var source = video.querySelector('source')
                if (source) {
                    source.src = videoUrl || 'http://198.18.0.1:3000/video.mp4'
                } else {
                    video.src = videoUrl || 'http://198.18.0.1:3000/video.mp4'
                }

                video.load()
                video.play().catch(function (error) {
                    console.error('Error playing video:', error)
                })
            }

            function stopTabletVideo () {
                var videoContainer = document.getElementById('video-container')
                if (!videoContainer) return

                var video = videoContainer.querySelector('video')
                if (!video) return

                console.log('Stopping tablet video, restoring original')

                // Restore original video source
                video.pause()
                if (originalVideoSrc) {
                    var source = video.querySelector('source')
                    if (source) {
                        source.src = originalVideoSrc
                    } else {
                        video.src = originalVideoSrc
                    }
                    video.load()
                    video.play().catch(function (error) {
                        console.error('Error restoring video:', error)
                    })
                }
            }

            window.playTabletVideo = playTabletVideo
            window.stopTabletVideo = stopTabletVideo



            function getParam (name) {
                var m = (location.search || '').match(new RegExp('[?&]' + name + '=([^&]+)'))
                return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : ''
            }
            var robot = (getParam('robot') || window.DEFAULT_ROBOT_NAME || 'Haku')
            var BASE = getParam('base')
            if (!/^https?:\/\//i.test(BASE || '')) { BASE = (location.origin || (location.protocol + '//' + location.host)); addLog('No ?base=, fallback to ' + BASE) }
            document.getElementById('robot-name').textContent = robot

            function abs (p) { return (BASE.replace(/\/$/, '') + p) }

            // ---- XHR tool（replace fetch/await）----
            function xhr (method, url, body, cb) {
                try {
                    var x = new XMLHttpRequest()
                    x.open(method, url, true)
                    if (method === 'POST') x.setRequestHeader('Content-Type', 'application/json')
                    x.onreadystatechange = function () {
                        if (x.readyState === 4) { cb(null, x.status, x.responseText) }
                    }
                    x.onerror = function () { cb(new Error('network')) }
                    x.send(body || null)
                } catch (e) { cb(e) }
            }

            // ---- heartbeat ----
            function heartbeat (tag) {
                xhr('POST', abs('/api/robot-tablet/heartbeat'), JSON.stringify({ robot: robot, tag: tag || 'tick' }), function () { })
            }

            // ---- textBubble ----
            var textBubble = document.getElementById('text-bubble')
            var bubbleContent = document.getElementById('bubble-content')

            var currentAIResponse = ''
            var bubbleTimer = null
            var conversationActive = false
            var conversationHistory = []
            var currentAIResponseText = ''
            var inactivityTimer = null


            function showConversationInterface () {
                var videoContainer = document.getElementById('video-container')
                var conversationInterface = document.getElementById('conversation-interface')

                if (videoContainer && conversationInterface) {
                    conversationInterface.style.display = 'block'
                    conversationInterface.className = 'conversation-interface'

                    setTimeout(function () {
                        conversationInterface.className = 'conversation-interface active'
                    }, 50)

                    conversationActive = true

                    // Clear any existing auto-return timer
                    if (inactivityTimer) {
                        clearTimeout(inactivityTimer)
                        inactivityTimer = null
                    }

                    console.log('Conversation interface shown')
                }
            }

            function hideConversationInterface () {
                var videoContainer = document.getElementById('video-container')
                var conversationInterface = document.getElementById('conversation-interface')

                if (videoContainer && conversationInterface) {
                    conversationInterface.className = 'conversation-interface'

                    setTimeout(function () {
                        conversationInterface.style.display = 'none'
                    }, 500)

                    // Ensure video container is always visible
                    videoContainer.style.display = 'block'
                    videoContainer.style.visibility = 'visible'
                    conversationActive = false

                    // Clear any existing timer
                    if (inactivityTimer) {
                        clearTimeout(inactivityTimer)
                        inactivityTimer = null
                    }

                    aiResponseStarted = false

                    console.log('Conversation interface hidden, returned to video')
                }
            }

            function startAutoReturnTimer () {
                // Clear any existing timer
                if (inactivityTimer) {
                    clearTimeout(inactivityTimer)
                }

                // Set 10-second timer to return to video
                inactivityTimer = setTimeout(function () {
                    if (conversationActive) {
                        hideConversationInterface()
                    }
                }, 10000) // 5 seconds

                console.log('Auto-return timer started (5 seconds)')
            }

            function forceStopAIResponse () {
                aiResponseStarted = false
                if (aiResponseTimeout) {
                    clearTimeout(aiResponseTimeout)
                    aiResponseTimeout = null
                }
                console.log('AI response force stopped')
            }





            function updateUserMessage (content) {
                var userMessageContent = document.getElementById('user-message-content')
                if (userMessageContent) {
                    userMessageContent.textContent = content || 'Waiting for your message...'
                    userMessageContent.scrollTop = userMessageContent.scrollHeight
                }
            }

            function updateAIMessage (content) {
                var aiMessageContent = document.getElementById('ai-message-content')
                if (aiMessageContent) {
                    aiMessageContent.textContent = content || 'Waiting for Haku\'s response...'
                    aiMessageContent.scrollTop = aiMessageContent.scrollHeight
                }
            }



            function showUserBubble (content) {
                console.log('showUserBubble called with:', content)
                console.log('textBubble element:', textBubble)
                console.log('bubbleContent element:', bubbleContent)
                if (!textBubble || !content) {
                    console.log('showUserBubble: missing elements or content')
                    return
                }

                if (bubbleTimer) {
                    clearTimeout(bubbleTimer)
                    bubbleTimer = null
                }

                bubbleContent.textContent = '👤 ' + content
                bubbleContent.className = 'bubble-content'

                textBubble.style.display = 'flex'
                textBubble.className = 'text-bubble'

                setTimeout(function () {
                    textBubble.className = 'text-bubble show'
                }, 50)

                console.log('User bubble should be visible now')

                bubbleTimer = setTimeout(function () {
                    textBubble.className = 'text-bubble hide'
                    setTimeout(function () {
                        textBubble.style.display = 'none'
                        textBubble.className = 'text-bubble'
                    }, 600)
                }, 12000)
            }



            var aiResponseStarted = false

            function updateLLMDisplay (type, content, isChunk, isFinal) {
                console.log('updateLLMDisplay called:', type, content ? content.substring(0, 50) : 'empty', isChunk, isFinal)
                if (!content) content = ''

                var KEY_CITY = /(?:\bcity\s*north\b)/i


                if (type === 'user') {
                    currentAIResponse = ''
                    currentAIResponseText = ''
                    aiResponseStarted = false

                    showConversationInterface()
                    updateUserMessage(content)
                    updateAIMessage('Waiting for Haku\'s response...')
                    startAutoReturnTimer()
                    return
                }

                if (type === 'ai') {
                    currentAIResponse += content
                    currentAIResponseText += content
                    console.log('AI processing:', isChunk, isFinal, currentAIResponse.length)

                    updateAIMessage(currentAIResponseText)

                    // Check for keywords in current content
                    if (KEY_CITY.test(content)) {
                        console.log('City North keyword detected in current content:', content)
                        showCityNorth()
                    }


                    if (isFinal === true) {
                        console.log('AI response finished')
                        aiResponseStarted = false
                        currentAIResponse = ''
                        currentAIResponseText = ''
                    }
                }
            }

            window.pushMsg = function (m) {
                try {
                    if (!m) return
                    console.log('pushMsg received:', m.type, m.content ? m.content.substring(0, 20) : 'no content')
                    if (m.type === 'llm-user-input') {
                        updateLLMDisplay('user', m.content, false, false)
                    } else if (m.type === 'llm-ai-response') {
                        var flags = parseStreamFlags(m)
                        updateLLMDisplay('ai', m.content, flags.isChunk, flags.isFinal)
                    }
                } catch (e) { console.error('pushMsg error', e) }
            }
            window.updateLLMDisplay = updateLLMDisplay
            window.showUserBubble = showUserBubble


            function isFinalMsg (msg) {
                var v = msg && (msg.final || msg.done || msg.isFinal || msg.end)
                var phase = msg && (msg.phase || msg.event)
                return v === true || v === 1 || v === '1' || v === 'true' || phase === 'final' || phase === 'end' || phase === 'stop'
            }
            function isChunkMsg (msg) {
                if (isFinalMsg(msg)) return false
                var v = msg && (msg.isChunk || msg.chunk || msg.delta)
                var phase = msg && (msg.phase || msg.event)
                return v === true || v === 1 || v === '1' || v === 'true' || v === 'delta' || phase === 'delta' || phase === 'chunk'
            }
            function parseStreamFlags (msg) {
                var phase = msg && (msg.phase || msg.event || msg.status)
                var isFinal = false

                // Check for various final indicators
                if (msg && (msg.final || msg.done || msg.isFinal || msg.end || msg.isFinished)) isFinal = true
                if (phase === 'final' || phase === 'end' || phase === 'stop' || phase === 'complete') isFinal = true

                var v = msg && (msg.isChunk || msg.chunk || msg.delta)
                var isChunk = !isFinal
                if (!isFinal && (v === true || v === 1 || v === '1' || v === 'true' || v === 'delta')) isChunk = true
                if (!isFinal && (phase === 'delta' || phase === 'chunk' || phase === 'stream')) isChunk = true

                return { isChunk, isFinal }
            }

            // ---- WebSocket ----
            var mainWs = null, wsTimer = null
            function wsURL () {
                var host = BASE.replace(/^https?:\/\//, '')
                var scheme = (/^https:\/\//i).test(BASE) ? 'wss://' : 'ws://'
                return scheme + host + '/api/sync'
            }
            function connectWS () {
                try {
                    if (!('WebSocket' in window)) { console.warn('No WebSocket support'); return }
                    if (mainWs) { try { mainWs.close() } catch (e) { } mainWs = null }
                    var url = wsURL()
                    console.log('WS connect →', url, 'robot=', robot)
                    mainWs = new WebSocket(url)

                    mainWs.onopen = function () {
                        console.log('WS open')
                        document.getElementById('network-indicator').className = 'network-dot active'
                        document.getElementById('network-status').textContent = 'ONLINE'
                        try { mainWs.send(JSON.stringify({ type: 'hello', role: 'tablet', robot: robot })) } catch (e) { }
                        heartbeat('ws-open')
                    }
                    mainWs.onmessage = function (evt) {
                        var msg = null; try { msg = JSON.parse(evt.data || '{}') } catch (e) { console.error('WS parse', e); return }
                        var toMe = (!msg.robot) || (String(msg.robot).toLowerCase() === String(robot).toLowerCase())
                        if (!toMe) return
                        if (msg.cmd === 'tablet_ping') { heartbeat('pong'); return }
                        if (msg.type === 'llm-user-input') {
                            // Use pushMsg to avoid duplicate processing
                            window.pushMsg(msg)
                            return
                        }
                        if (msg.type === 'llm-ai-response') {
                            console.log('AI message received:', msg)
                            // Use pushMsg to avoid duplicate processing
                            window.pushMsg(msg)
                            return
                        }

                        //City North pop up
                        if (msg.type === 'show-city-north') {
                            showCityNorth(msg.imageSrc)
                            return
                        }
                        if (msg.type === 'hide-city-north') {
                            hideCityNorth()
                            return
                        }



                        // Tablet video control
                        if (msg.cmd === 'tablet-video-play') {
                            playTabletVideo(msg.videoUrl)
                            return
                        }
                        if (msg.cmd === 'tablet-video-stop') {
                            stopTabletVideo()
                            return
                        }

                        // Text bubble control (TODO)
                        if (msg.type === 'robot-status-update') {
                            // TODO: Handle if converstation active - should we display text bubble or not?
                            return
                        }

                        console.log('WS other', evt.data)
                    }
                    mainWs.onerror = function (e) { console.error('WS error', e) }
                    mainWs.onclose = function (ev) {
                        console.warn('WS close', ev && ev.code, ev && ev.reason)
                        document.getElementById('network-indicator').className = 'network-dot'
                        document.getElementById('network-status').textContent = 'OFFLINE'
                        if (wsTimer) clearTimeout(wsTimer)
                        wsTimer = setTimeout(connectWS, 2000)
                    }
                } catch (e) {
                    console.error('WS create failed', e)
                    if (wsTimer) clearTimeout(wsTimer)
                    wsTimer = setTimeout(connectWS, 2000)
                }
            }

            // ---- Polling fallback (distinguish WS/router issues) ----
            function pollLoop () {
                xhr('GET', abs('/api/pull?robot=' + encodeURIComponent(robot)), null, function (err, status, text) {
                    if (!err && status === 200) {
                        try {
                            var list = JSON.parse(text || '[]')
                            if (list && list.length) { console.log('Poll got', list.length); for (var i = 0; i < list.length; i++) { window.pushMsg(list[i]) } }
                        } catch (e) { console.error('Poll JSON', e) }
                    } else if (err) { console.error('Poll err', err) }
                    setTimeout(pollLoop, 2000)
                })
            }



            // ---- start ----
            addLog('Init robot=' + robot + ' base=' + BASE)

            // Ensure video container is visible on startup
            var videoContainer = document.getElementById('video-container')
            if (videoContainer) {
                videoContainer.style.display = 'block'
                videoContainer.style.visibility = 'visible'
                console.log('Video container initialized and made visible')
            }


            heartbeat('init')
            connectWS()
            pollLoop()
            setInterval(function () {
                heartbeat('tick')
                var s = mainWs ? ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'][mainWs.readyState] : 'NULL'
                var e = document.getElementById('network-status'); if (e) e.textContent = s
            }, 10000)
        })();
    </script>


</body>

</html>
