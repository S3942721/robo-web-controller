<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Brain Interface</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #E60028;
            overflow: hidden;
            height: 100vh;
            width: 100%;
        }
        
        .container {
            width: 100%;
            height: 100vh;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
        }
        
        .header {
            text-align: center;
            background: linear-gradient(45deg, #1a0000, #330000);
            border: 1px solid #E60028;
            border-radius: 8px;
            padding: 15px;
            position: relative;
            overflow: hidden;
            height: 60px;
            margin-bottom: 10px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 24px;
            text-shadow: 0 0 10px #E60028;
        }
        
        .header .subtitle {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        .header .robot-name {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 14px;
            padding: 5px 10px;
            border: 1px solid #E60028;
            border-radius: 4px;
            background: rgba(230, 0, 40, 0.1);
        }
        
        .main-content {
            background: rgba(20, 0, 0, 0.8);
            border: 1px solid #E60028;
            border-radius: 8px;
            padding: 0;
            overflow: hidden;
            position: absolute;
            top: 100px;
            left: 10px;
            right: 10px;
            bottom: 100px;
        }
        
        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            margin: 0;
            padding: 0;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .footer {
            background: rgba(20, 0, 0, 0.8);
            border: 1px solid #E60028;
            color: rgba(255, 255, 255, 1);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            opacity: 0.9;
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: 40px;
            line-height: 40px;
        }
        
        .footer img {
            height: 40px;
            vertical-align: middle;
        }
        
        /* Network activity indicator */
        .network-activity {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .network-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            animation: networkBlink 2s infinite;
        }
        
        .network-dot.active {
            background: #E60028;
            animation: networkActive 0.5s infinite;
        }
        
        @keyframes networkBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
        
        @keyframes networkActive {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="network-activity">
                <span class="network-dot" id="network-indicator"></span>
                <span id="network-status">OFFLINE</span>
            </div>
            <h1>HAKU THE AI ROBOT</h1>
            <!-- <div class="subtitle">Real-time Activity Monitor</div> -->
            <div class="robot-name" id="robot-name">HAKU</div>
        </div>

        <div class="main-content">
            <div class="video-container">
            <iframe id="yt-frame" src="https://www.youtube-nocookie.com/embed/avs-mPoAUSE?autoplay=1&mute=1&controls=0&showinfo=0&rel=0&iv_load_policy=3&modestbranding=1&disablekb=1&fs=0&cc_load_policy=0&playlist=avs-mPoAUSE&loop=1&playsinline=1&enablejsapi=1&title=0&byline=0&portrait=0"
                allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
                referrerpolicy="origin-when-cross-origin"
                allowfullscreen></iframe>
                <!-- <iframe src="https://www.youtube.com/embed/NE0n0IwHxtI?autoplay=1&mute=1&controls=0&showinfo=0&rel=0&iv_load_policy=3&modestbranding=1&disablekb=1&fs=0&cc_load_policy=0&playlist=NE0n0IwHxtI&loop=1" allowfullscreen></iframe> -->
            </div>
        </div>

        <div class="footer">
            Powered by &nbsp;<img src="RACE-WHITE-WIDE.png" alt="Race Logo">
        </div>
    </div>
</body>
</html>
